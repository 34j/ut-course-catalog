[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "ut-course-catalog"
version = "1.0.0"
description = "Python package for fetching UTokyo Online Course Catalogue"
readme = "README.md"
license = "MIT"
authors = [ { name = "34j" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "aiofiles>=23.2.1,<24",
  "aiohttp>=3.8.6,<4",
  "aiohttp-client-cache[all]>=0.12,<1",
  "beautifulsoup4>=4.12.2,<5",
  "click>=8.1.7,<9",
  "pandas>=2.1.1,<3",
  "pillow>=10,<12",
  "rich>=13.6,<14",
  "tenacity>=8.2.3,<9",
  "tqdm>=4.66.1,<5",
  "typing-extensions>=4.8,<5",
]
urls."Bug Tracker" = "https://github.com/34j/ut-course-catalog/issues"
urls.Changelog = "https://github.com/34j/ut-course-catalog/blob/main/CHANGELOG.md"
urls.documentation = "https://ut-course-catalog.readthedocs.io"
urls.repository = "https://github.com/34j/ut-course-catalog"
scripts.ut-course-catalog = "ut_course_catalog.cli:cli"
scripts.utcc = "ut_course_catalog.cli:cli"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]
notebook = [
  "ipykernel>=6.25.2,<7",
  "jupyter>=1,<2",
  "matplotlib>=3.8,<4",
  "matplotx>=0.3.10,<1",
  "scikit-learn>=1.3.1,<2",
  "seaborn>=0.13,<1",
]
wordcloud = [
  "janome>=0.5.1,<1",
  "wordcloud>=1.9.2,<2",
]

[tool.ruff]
extend = ".venv/ruff.toml"
exclude = [ "docs/conf.py", "ut-course-catalog-tutorial.ipynb" ]
lint.select = [ "E4", "E7", "E9", "F" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true

[tool.pytest]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = "-v -Wdefault --cov=ut_course_catalog --cov-report=term-missing:skip-covered"

[tool.coverage]
run.branch = true
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__"',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]
